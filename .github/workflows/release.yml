# Builds the signed Android APK and publishes it as a GitHub release when a
# version tag (v1.2.3) is pushed. See "Releasing" in README.md.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # mise.toml has an [env] section, which mise only applies from trusted
      # config files; CI cannot answer the trust prompt.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Check that the tag matches the pubspec version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Get dependencies
        run: mise run get

      - name: Analyze
        run: mise run analyze

      - name: Test
        run: mise run test

      - name: Decode the release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: mise run build-apk-release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$RUNNER_TEMP/mobile-topo-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Mobile Topo $VERSION" --generate-notes
